name: Documentation Screenshots

on:
  push:
    branches: [main]
    paths:
      - "custom_components/yeelight_cube/**"
      - "tests/card-docs*"
      - "custom_components/yeelight_cube/layout.py"
      - "package*.json"
      - "README.md"
      - "SERVICES.md"
      - "docs/DOCUMENTATION_SCREENSHOTS.md"
      - "images/Cards/generated/**"
      - ".github/workflows/documentation-screenshots.yaml"
  pull_request:
    paths:
      - "custom_components/yeelight_cube/**"
      - "tests/card-docs*"
      - "custom_components/yeelight_cube/layout.py"
      - "package*.json"
      - "README.md"
      - "SERVICES.md"
      - "docs/DOCUMENTATION_SCREENSHOTS.md"
      - "images/Cards/generated/**"
      - ".github/workflows/documentation-screenshots.yaml"
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: documentation-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    if: "!contains(github.event.head_commit.message, '[docs-generated]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      homeassistant:
        image: ghcr.io/home-assistant/home-assistant:2026.9.3
        ports:
          - 8123:8123
        options: >-
          --health-cmd "curl --fail http://localhost:8123/api/onboarding || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: node --test tests/card-docs.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:update
        env:
          DOCS_HA_URL: http://127.0.0.1:8123
          DOCS_HA_ONBOARD: "1"
      # Captures that rendered differently each time, with a diff image.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: card-documentation-diagnostics
          path: test-results/card-docs/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: card-documentation-screenshots
          path: images/Cards/generated/*.png
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: screenshots
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check capture revision is still current
        id: revision
        env:
          CAPTURE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$CAPTURE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated captures; main has advanced."
          fi
      - uses: actions/setup-node@v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: card-documentation-screenshots
          path: images/Cards/generated
      - name: Refresh generated galleries and commit images
        if: steps.revision.outputs.current == 'true'
        run: |
          node tests/card-docs-readme.cjs
          node tests/card-docs-readme.cjs --check
          git add -- README.md images/Cards/generated
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh card screenshots and galleries [docs-generated]"
          git push origin HEAD:main
